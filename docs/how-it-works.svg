<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 780" width="760" height="780" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>How tg-spam-catcher-jev decides</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<rect x="160" y="20" width="340" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="330.0" y="42.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">New event in the discussion group</text>
<text x="330.0" y="60.0" text-anchor="middle" font-size="13" fill="#1f2328">comment  ·  reaction  ·  new member</text>
<line x1="330" y1="72" x2="330" y2="100" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="160" y="100" width="340" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="330.0" y="127.0" text-anchor="middle" font-size="14" fill="#1f2328">Superuser, admin or already approved?</text>
<rect x="590" y="100" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="665.0" y="127.0" text-anchor="middle" font-size="14" fill="#1f2328">yes: ignored</text>
<line x1="500" y1="122" x2="590" y2="122" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="144" x2="330" y2="176" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="338" y="164" font-size="12" fill="#57606a">no</text>
<rect x="160" y="176" width="340" height="56" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="330.0" y="200.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">1. tg-spam checks the text</text>
<text x="330.0" y="218.0" text-anchor="middle" font-size="13" fill="#1f2328">stop words, classifier, similarity, LLM</text>
<rect x="590" y="176" width="150" height="56" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="665.0" y="200.0" text-anchor="middle" font-size="14" fill="#1f2328">spam: delete message</text>
<text x="665.0" y="218.0" text-anchor="middle" font-size="13" fill="#1f2328">and ban (as upstream)</text>
<line x1="500" y1="204" x2="590" y2="204" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="520" y="196" font-size="12" fill="#57606a">spam</text>
<line x1="330" y1="232" x2="330" y2="264" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<text x="338" y="254" font-size="12" fill="#57606a">ham</text>
<rect x="160" y="264" width="340" height="64" rx="8" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
<text x="330.0" y="283.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">2. Read the profile</text>
<text x="330.0" y="301.0" text-anchor="middle" font-size="13" fill="#1f2328">bio, personal channel + last posts,</text>
<text x="330.0" y="319.0" text-anchor="middle" font-size="13" fill="#1f2328">up to 3 avatars, cached 7 days</text>
<line x1="330" y1="328" x2="330" y2="360" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="160" y="360" width="340" height="64" rx="8" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
<text x="330.0" y="379.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">3. Ask jev (one request)</text>
<text x="330.0" y="397.0" text-anchor="middle" font-size="13" fill="#1f2328">comment class, relevance to the post, bait,</text>
<text x="330.0" y="415.0" text-anchor="middle" font-size="13" fill="#1f2328">profile ads (adult/drugs/scam), photo</text>
<line x1="330" y1="424" x2="330" y2="456" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="160" y="456" width="340" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="330.0" y="478.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">4. Fixed decision rules</text>
<text x="330.0" y="496.0" text-anchor="middle" font-size="13" fill="#1f2328">app/profile/decide.go, thresholds --jev.th.*</text>
<line x1="270" y1="508" x2="140" y2="556" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="330" y1="508" x2="370" y2="556" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="390" y1="508" x2="600" y2="556" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="556" width="200" height="70" rx="8" fill="#ffebe9" stroke="#ff8182" stroke-width="1.5"/>
<text x="140.0" y="578.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">BAN</text>
<text x="140.0" y="596.0" text-anchor="middle" font-size="13" fill="#1f2328">clear spam, or an ad profile</text>
<text x="140.0" y="614.0" text-anchor="middle" font-size="13" fill="#1f2328">backed up by the comment</text>
<rect x="270" y="556" width="200" height="70" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
<text x="370.0" y="578.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">REVIEW</text>
<text x="370.0" y="596.0" text-anchor="middle" font-size="13" fill="#1f2328">doubtful: comment deleted,</text>
<text x="370.0" y="614.0" text-anchor="middle" font-size="13" fill="#1f2328">user restricted</text>
<rect x="500" y="556" width="200" height="70" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="600.0" y="578.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">PASS / SKIP</text>
<text x="600.0" y="596.0" text-anchor="middle" font-size="13" fill="#1f2328">nothing found, or jev failed:</text>
<text x="600.0" y="614.0" text-anchor="middle" font-size="13" fill="#1f2328">no sanction, ever</text>
<line x1="140" y1="626" x2="140" y2="664" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="370" y1="626" x2="370" y2="664" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="40" y="664" width="200" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="140.0" y="690.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Admin card</text>
<text x="140.0" y="708.0" text-anchor="middle" font-size="13" fill="#1f2328">button: Unban</text>
<rect x="270" y="664" width="200" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="370.0" y="690.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Admin card</text>
<text x="370.0" y="708.0" text-anchor="middle" font-size="13" fill="#1f2328">buttons: Ban / Not spam</text>
<text x="380.0" y="765" text-anchor="middle" font-size="13" fill="#57606a">A human has the last word: every sanction is one click from being undone.</text>
</svg>
